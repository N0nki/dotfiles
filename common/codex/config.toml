model = "gpt-6.1-sol"
web_search_request = true
personality = "pragmatic"
model_reasoning_effort = "medium"

[notice]
hide_gpt5_1_migration_prompt = true

[notice.model_migrations]
"gpt-5.3-codex" = "gpt-5.4"

[mcp_servers.aws_api_mcp_server]
startup_timeout_sec = 300
command = "uvx"
args = ["awslabs.aws-api-mcp-server@latest"]
env = { "AWS_REGION" = "ap-northeast-1" }

[mcp_servers.terraform_mcp_server]
startup_timeout_sec = 300
command = "docker"
args = ["run", "-i", "--rm", "hashicorp/terraform-mcp-server:latest"]

[mcp_servers.context7]
startup_timeout_sec = 300
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[projects."~/dotfiles"]
trust_level = "trusted"

[plugins."github@openai-curated"]
enabled = true

[tui]
screen_reader_detection_done = true

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4
gpt-6-astra = 4
"gpt-6.1-sol" = 4

# Record coding-agent state for the tmux session chooser.
# Review and trust these definitions in Codex /hooks after restarting.

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = 'python3 "$HOME/dotfiles/common/tmux/agent-status.py" hook codex'
timeout = 3

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = 'python3 "$HOME/dotfiles/common/tmux/agent-status.py" hook codex'
timeout = 3

[[hooks.PreToolUse]]
[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$HOME/dotfiles/common/tmux/agent-status.py" hook codex'
timeout = 3

[[hooks.PermissionRequest]]
[[hooks.PermissionRequest.hooks]]
type = "command"
command = 'python3 "$HOME/dotfiles/common/tmux/agent-status.py" hook codex'
timeout = 3

[[hooks.PostToolUse]]
[[hooks.PostToolUse.hooks]]
type = "command"
command = 'python3 "$HOME/dotfiles/common/tmux/agent-status.py" hook codex'
timeout = 3

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = 'python3 "$HOME/dotfiles/common/tmux/agent-status.py" hook codex'
timeout = 3

[[hooks.Interrupt]]
[[hooks.Interrupt.hooks]]
type = "command"
command = 'python3 "$HOME/dotfiles/common/tmux/agent-status.py" hook codex'
timeout = 3

[[hooks.SessionEnd]]
[[hooks.SessionEnd.hooks]]
type = "command"
command = 'python3 "$HOME/dotfiles/common/tmux/agent-status.py" hook codex'
timeout = 3
